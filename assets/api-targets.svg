<style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf6ff}.h{font-weight:800}.m{fill:#9bc5e9}.c{fill:#5ad4ff}.g{fill:#ffc552}.panel{fill:url(#glass);stroke:#4ccfff;stroke-width:2}.goldp{fill:url(#glass);stroke:#ffc552;stroke-width:2}.small{font-size:20px}.mid{font-size:27px}.title{font-size:54px}.subtitle{font-size:25px;letter-spacing:4px}.flow{stroke:#38c9ff;stroke-width:5;fill:none;filter:url(#glow)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1450" cy="80" r="300" fill="#0f5fa5" opacity=".12"/><circle cx="120" cy="820" r="260" fill="#ffac28" opacity=".07"/><text x="70" y="85" class="t h title">BitWeave — Commands, ABIs &amp; Targets</text><text x="72" y="128" class="t subtitle c">THE FORWARD AUTHORING SURFACE</text><line x1="70" y1="152" x2="1530" y2="152" stroke="#184d75" stroke-width="2"/><g filter="url(#shadow)"><rect x="60" y="210" rx="24" width="450" height="535" class="panel"/><text x="88" y="258" class="t h mid">Build Commands</text><text x="88" y="300" class="t small m">build-bits source.bwx out.bits</text><text x="88" y="332" class="t small m">build-linux-exec source.bwx out.elf</text><text x="88" y="364" class="t small m">build-linux-pie source.bwx out.pie</text><text x="88" y="396" class="t small m">build-win64 source.bwx out.exe</text><text x="88" y="428" class="t small m">pack in.bits out.bin</text><text x="88" y="460" class="t small m">canon in.bwa out.bits</text></g><g filter="url(#shadow)"><rect x="575" y="210" rx="24" width="450" height="535" class="goldp"/><text x="603" y="258" class="t h mid">Verification &amp; Metadata</text><text x="603" y="300" class="t small m">verify bits built-file</text><text x="603" y="332" class="t small m">sha256 file</text><text x="603" y="364" class="t small m">manifest file target kind</text><text x="603" y="396" class="t small m">abi sysv-amd64</text><text x="603" y="428" class="t small m">abi linux-x86_64-syscall</text><text x="603" y="460" class="t small m">abi win64</text></g><g filter="url(#shadow)"><rect x="1090" y="210" rx="24" width="450" height="535" class="panel"/><text x="1118" y="258" class="t h mid">Native Targets</text><text x="1118" y="300" class="t small m">Linux x86-64 ET_EXEC</text><text x="1118" y="332" class="t small m">Linux x86-64 PIE / ET_DYN</text><text x="1118" y="364" class="t small m">Windows x86-64 PE32+</text><text x="1118" y="396" class="t small m">SysV AMD64 calling convention</text><text x="1118" y="428" class="t small m">Linux syscall ABI</text><text x="1118" y="460" class="t small m">Win64 calling convention</text></g><path d="M510 470 L575 470" class="flow"/><circle r="8" fill="#ffe181" filter="url(#glow)"><animateMotion dur="3.2s" begin="-0.2s" repeatCount="indefinite" path="M510 470 L575 470"/></circle><path d="M1025 470 L1090 470" class="flow"/><circle r="8" fill="#ffe181" filter="url(#glow)"><animateMotion dur="3.2s" begin="-1.0s" repeatCount="indefinite" path="M1025 470 L1090 470"/></circle><text x="800" y="800" text-anchor="middle" class="t h mid c">One authored program → exact bits → target-native container.</text></svg>