<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020711"/><stop offset="0.55" stop-color="#07172b"/><stop offset="1" stop-color="#02050b"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#153d68" stop-opacity=".74"/><stop offset="1" stop-color="#061425" stop-opacity=".94"/></linearGradient>
