<style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf6ff}.h{font-weight:800}.m{fill:#9bc5e9}.c{fill:#5ad4ff}.g{fill:#ffc552}.panel{fill:url(#glass);stroke:#4ccfff;stroke-width:2}.goldp{fill:url(#glass);stroke:#ffc552;stroke-width:2}.small{font-size:20px}.mid{font-size:27px}.title{font-size:54px}.subtitle{font-size:25px;letter-spacing:4px}.flow{stroke:#38c9ff;stroke-width:5;fill:none;filter:url(#glow)}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1450" cy="80" r="300" fill="#0f5fa5" opacity=".12"/><circle cx="120" cy="820" r="260" fill="#ffac28" opacity=".07"/><text x="70" y="85" class="t h title">BitWeave — Verification &amp; Provenance</text><text x="72" y="128" class="t subtitle c">A SMALLER, EXPLICIT TRUST CHAIN</text><line x1="70" y1="152" x2="1530" y2="152" stroke="#184d75" stroke-width="2"/><g filter="url(#shadow)"><rect x="70" y="245" rx="24" width="255" height="355" class="panel"/><text x="98" y="293" class="t h mid">SOURCE</text><text x="98" y="335" class="t small m">Authored .bwx</text><text x="98" y="367" class="t small m">Version controlled</text></g><g filter="url(#shadow)"><rect x="370" y="245" rx="24" width="255" height="355" class="panel"/><text x="398" y="293" class="t h mid">.BITS</text><text x="398" y="335" class="t small m">Canonical 0/1</text><text x="398" y="367" class="t small m">Exact byte intent</text></g><g filter="url(#shadow)"><rect x="670" y="245" rx="24" width="255" height="355" class="goldp"/><text x="698" y="293" class="t h mid">NATIVE IMAGE</text><text x="698" y="335" class="t small m">ELF / PIE / PE</text><text x="698" y="367" class="t small m">Direct CPU code</text></g><g filter="url(#shadow)"><rect x="970" y="245" rx="24" width="255" height="355" class="panel"/><text x="998" y="293" class="t h mid">VERIFY</text><text x="998" y="335" class="t small m">Byte equality</text><text x="998" y="367" class="t small m">SHA-256</text><text x="998" y="399" class="t small m">Tests</text></g><g filter="url(#shadow)"><rect x="1270" y="245" rx="24" width="255" height="355" class="goldp"/><text x="1298" y="293" class="t h mid">RELEASE</text><text x="1298" y="335" class="t small m">Source tree</text><text x="1298" y="367" class="t small m">Binaries</text><text x="1298" y="399" class="t small m">Evidence</text></g><path d="M325 420 L370 420" class="flow"/><circle r="8" fill="#ffe181" filter="url(#glow)"><animateMotion dur="3.2s" begin="-0s" repeatCount="indefinite" path="M325 420 L370 420"/></circle><path d="M625 420 L670 420" class="flow"/><circle r="8" fill="#ffe181" filter="url(#glow)"><animateMotion dur="3.2s" begin="-0.6s" repeatCount="indefinite" path="M625 420 L670 420"/></circle><path d="M925 420 L970 420" class="flow"/><circle r="8" fill="#ffe181" filter="url(#glow)"><animateMotion dur="3.2s" begin="-1.2s" repeatCount="indefinite" path="M925 420 L970 420"/></circle><path d="M1225 420 L1270 420" class="flow"/><circle r="8" fill="#ffe181" filter="url(#glow)"><animateMotion dur="3.2s" begin="-1.8s" repeatCount="indefinite" path="M1225 420 L1270 420"/></circle><text x="800" y="800" text-anchor="middle" class="t h mid c">The exact built bytes remain visible and independently packable.</text><text x="800" y="842" text-anchor="middle" class="t small m">The repository ships source, canonical bits, binaries, tests, manifests, evidence, and the standalone bit packer.</text></svg>